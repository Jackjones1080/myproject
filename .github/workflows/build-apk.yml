name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare launcher icon
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d app/src/main/assets/chaikhaneh_icon.jpg.b64 > app/src/main/res/drawable-nodpi/chaikhaneh_icon.jpg
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chaykhaneh-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
