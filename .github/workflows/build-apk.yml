name: Build User and Admin APKs
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses
          "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare user app launcher icon
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d app/src/main/assets/chaikhaneh_icon.jpg.b64 > app/src/main/res/drawable-nodpi/chaikhaneh_icon.jpg
      - name: Build both Android apps
        run: gradle :app:assembleDebug :adminApp:assembleDebug
      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: Chaykhaneh-User-and-Admin-APKs
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            adminApp/build/outputs/apk/debug/adminApp-debug.apk
          retention-days: 14
